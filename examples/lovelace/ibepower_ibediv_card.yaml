type: custom:config-template-card
variables:
  - "'test_no_usar'"
  - "'/ibepower_static/ibepower_logo.png'"
entities:
  - ${'sensor.' + vars[0] + '_solar_watts'}
  - ${'sensor.solar_watts_' + vars[0]}
  - ${'sensor.' + vars[0] + '_grid_watts'}
  - ${'sensor.grid_watts_' + vars[0]}
  - ${'sensor.' + vars[0] + '_load_watts'}
  - ${'sensor.load_watts_' + vars[0]}
  - ${'sensor.' + vars[0] + '_battery_power'}
  - ${'sensor.battery_power_' + vars[0]}
  - ${'sensor.' + vars[0] + '_battery_soc'}
  - ${'sensor.battery_soc_' + vars[0]}
  - ${'sensor.' + vars[0] + '_calculated_watts'}
  - ${'sensor.calculated_watts_' + vars[0]}
  - ${'sensor.' + vars[0] + '_pwm_value'}
  - ${'sensor.pwm_value_' + vars[0]}
  - ${'sensor.' + vars[0] + '_kw_solar_today'}
  - ${'sensor.kw_solar_today_' + vars[0]}
  - ${'sensor.' + vars[0] + '_kw_import_today'}
  - ${'sensor.kw_import_today_' + vars[0]}
  - ${'sensor.' + vars[0] + '_kw_export_today'}
  - ${'sensor.kw_export_today_' + vars[0]}
  - ${'sensor.' + vars[0] + '_kw_diverter_today'}
  - ${'sensor.kw_diverter_today_' + vars[0]}
  - ${'switch.' + vars[0] + '_ibediv'}
  - ${'switch.ibediv_' + vars[0]}
  - ${'switch.' + vars[0] + '_switch_on_off'}
  - ${'switch.switch_on_off_' + vars[0]}
  - ${'select.' + vars[0] + '_modo_de_trabajo'}
  - ${'select.modo_de_trabajo_' + vars[0]}
  - ${'select.' + vars[0] + '_work_mode_select'}
  - ${'select.work_mode_select_' + vars[0]}
  - ${'number.' + vars[0] + '_manual'}
  - ${'number.manual_' + vars[0]}
  - ${'number.' + vars[0] + '_pwm_value_setter'}
  - ${'number.pwm_value_setter_' + vars[0]}
card:
  type: vertical-stack
  cards:
    - type: custom:button-card
      entity: >-
        ${((states['sensor.' + vars[0] + '_calculated_watts']) && ('sensor.' +
        vars[0] + '_calculated_watts')) || ('sensor.calculated_watts_' +
        vars[0])}
      name: ${('' + vars[0]).toUpperCase()}
      show_icon: false
      show_state: false
      show_label: false
      variables:
        base: ${vars[0]}
        logo_src: ${vars[1]}
      triggers_update: all
      custom_fields:
        logo: |
          [[[
            const toUrl = (p) => {
              if (hass && typeof hass.hassUrl === 'function') return hass.hassUrl(p);
              return p;
            };
            const primary = String(variables.logo_src || '/ibepower_static/ibepower_logo.png');
            const fallback = '/local/ibepower_logo.png';
            const src = toUrl(primary);
            const fallbackSrc = toUrl(fallback);
            return '<div class="ibep-brand-logo-wrap"><img class="ibep-brand-logo" src="' + src + '" data-fallback="' + fallbackSrc + '" onerror="if(!this.dataset.err){this.dataset.err=\'1\';this.src=this.dataset.fallback;}" alt="Ibepower"></div>';
          ]]]
        flow: |
          [[[
            const base = variables.base;
            const safeStates = (states && typeof states === 'object') ? states : {};
            const invalidState = (state) => {
              const s = String(state ?? '').trim().toLowerCase();
              return !s || s === 'unknown' || s === 'unavailable' || s === 'none' || s === 'null';
            };
            const getObj = (field) => safeStates['sensor.' + base + '_' + field] || safeStates['sensor.' + field + '_' + base];
            const getRaw = (field) => getObj(field)?.state;
            const hasEntity = (field) => {
              const obj = getObj(field);
              return !!obj && !invalidState(obj.state);
            };
            const num = (field) => {
              const raw = String(getRaw(field) ?? '').replace(',', '.');
              const v = Number(raw);
              return Number.isFinite(v) ? v : 0;
            };
            const fmtAbsW = (v) => Math.round(Math.abs(v)) + ' W';
            const fmtSignedW = (v) => {
              const n = Math.round(v);
              if (!Number.isFinite(n)) return '-- W';
              return n + ' W';
            };
            const fmtK = (v) => {
              const n = Number(v);
              return Number.isFinite(n) ? (n.toFixed(2) + ' kWh') : '-- kWh';
            };

            const solarW = num('solar_watts');
            const gridW = num('grid_watts');
            const loadW = num('load_watts');
            const batteryW = num('battery_power');
            const batterySoc = num('battery_soc');
            const diverterW = num('calculated_watts');
            const pwmRaw = String(getRaw('pwm_value') ?? '').replace(',', '.');
            const pwmNum = Number(pwmRaw);
            const pwmPct = Number.isFinite(pwmNum) ? Math.round(Math.max(0, Math.min(100, pwmNum))) : null;
            const pwmText = pwmPct === null ? '-- %' : (pwmPct + ' %');

            const solarK = hasEntity('kw_solar_today') ? num('kw_solar_today') : null;
            const importK = hasEntity('kw_import_today') ? num('kw_import_today') : null;
            const exportK = hasEntity('kw_export_today') ? num('kw_export_today') : null;
            const diverterK = hasEntity('kw_diverter_today') ? num('kw_diverter_today') : null;

            const browserLang = (typeof navigator !== 'undefined' && navigator.language) ? navigator.language : '';
            const rawLang = String(
              hass?.language ||
              hass?.selectedLanguage ||
              hass?.locale?.language ||
              browserLang ||
              'en'
            ).toLowerCase();
            const lang = rawLang.startsWith('es')
              ? 'es'
              : rawLang.startsWith('pt')
                ? 'pt'
                : rawLang.startsWith('en')
                  ? 'en'
                  : 'en';
            const i18n = {
              es: {
                charging: 'Cargando',
                discharging: 'Descargando',
                importing: 'Importando',
                exporting: 'Exportando',
                imp: 'Imp',
                exp: 'Exp',
                diverter: 'Derivando',
                diverterToday: 'Derivado Hoy',
                inverter: 'Inversor'
              },
              en: {
                charging: 'Charging',
                discharging: 'Discharging',
                importing: 'Importing',
                exporting: 'Exporting',
                imp: 'Imp',
                exp: 'Exp',
                diverter: 'Diverter',
                diverterToday: 'Diverted Today',
                inverter: 'Inverter'
              },
              pt: {
                charging: 'Carregando',
                discharging: 'Descarregando',
                importing: 'Importando',
                exporting: 'Exportando',
                imp: 'Imp',
                exp: 'Exp',
                diverter: 'Derivando',
                diverterToday: 'Derivado Hoje',
                inverter: 'Inversor'
              }
            };
            const t = i18n[lang] || i18n.en;

            const hasSolar = hasEntity('solar_watts');
            const hasGrid = hasEntity('grid_watts');
            const hasHome = hasEntity('load_watts');
            const hasBatteryPower = hasEntity('battery_power');
            const hasBatterySoc = hasEntity('battery_soc');
            const hasDiverter = hasEntity('calculated_watts');

            const loadWValid = hasHome && Number.isFinite(Number(String(getRaw('load_watts') ?? '').replace(',', '.')));
            const effectiveLoadW = loadWValid ? loadW : (solarW - gridW - batteryW);
            const solarActive = hasSolar && Math.abs(solarW) > 0;
            const gridActive = hasGrid && Math.abs(gridW) > 0;
            const homeActive = Math.abs(effectiveLoadW) > 0;
            const batteryActive = hasBatteryPower && Math.abs(batteryW) > 0;
            const diverterActive = hasDiverter && Math.abs(diverterW) > 0;

            const cSolarCenter = 'link-solar-center ' + (solarActive ? 'is-active flow-down' : 'is-idle');
            const battCenterDir = batteryW < 0 ? 'flow-right' : 'flow-left';
            const cBatteryCenter = 'link-battery-center ' + (batteryActive ? ('is-active ' + battCenterDir) : 'is-idle');
            const gridCenterDir = gridW >= 0 ? 'flow-right' : 'flow-left';
            const cGridCenter = 'link-grid-center ' + (gridActive ? ('is-active ' + gridCenterDir) : 'is-idle');
            const cHomeCenter = 'link-home-center ' + (homeActive ? 'is-active flow-down' : 'is-idle');
            const solarChargesBatt = solarActive && batteryActive && batteryW >= 0;
            const cSolarBattery = 'link-solar-battery ' + (solarChargesBatt ? 'is-active flow-right' : 'is-idle');
            const solarFeedsGrid = solarActive && gridActive && gridW >= 0;
            const cSolarGrid = 'link-solar-grid ' + (solarFeedsGrid ? 'is-active flow-right' : 'is-idle');
            const battFeedsHome = batteryActive && batteryW < 0 && homeActive;
            const cBatteryHome = 'link-battery-home ' + (battFeedsHome ? 'is-active flow-right' : 'is-idle');
            const gridFeedsHome = gridActive && gridW < 0 && homeActive;
            const cGridHome = 'link-grid-home ' + (gridFeedsHome ? 'is-active flow-right' : 'is-idle');

            const solarMain = hasSolar ? fmtAbsW(solarW) : '-- W';
            const gridMain = hasGrid ? fmtSignedW(gridW) : '-- W';
            const homeMain = fmtAbsW(effectiveLoadW);
            const batteryMain = hasBatteryPower ? fmtSignedW(batteryW) : '-- W';
            const diverterMain = hasDiverter ? fmtAbsW(diverterW) : '-- W';
            const inverterW = effectiveLoadW + gridW;
            const inverterMain = (hasHome || hasGrid || hasDiverter || hasSolar || hasBatteryPower) ? fmtAbsW(inverterW) : '-- W';
            const inverterActive = Math.abs(inverterW) > 0;
            const batterySocText = hasBatterySoc ? (Math.round(batterySoc) + ' %') : '';
            const batteryDirText = hasBatteryPower ? (batteryW >= 0 ? t.charging : t.discharging) : '';
            const battSoc = hasBatterySoc ? Math.max(0, Math.min(100, Math.round(batterySoc))) : 50;
            const battIcon = battSoc >= 90 ? 'mdi:battery' : battSoc >= 70 ? 'mdi:battery-high' : battSoc >= 50 ? 'mdi:battery-medium' : battSoc >= 20 ? 'mdi:battery-low' : 'mdi:battery-alert-variant-outline';
            const battColor = battSoc >= 60 ? '#41aa56' : battSoc >= 30 ? '#d8a038' : '#d54343';
            const gridDirText = hasGrid ? (gridW >= 0 ? t.exporting : t.importing) : '';

            const solarSubText = fmtK(solarK);
            const gridImpText = t.imp + '. ' + fmtK(importK);
            const gridExpText = t.exp + '. ' + fmtK(exportK);
            const diverterTodayText = t.diverterToday;
            const diverterTodayKwh = fmtK(diverterK);

            const hasSolarToday = hasEntity('kw_solar_today');
            const hasImportToday = hasEntity('kw_import_today');
            const hasExportToday = hasEntity('kw_export_today');
            const hasDiverterToday = hasEntity('kw_diverter_today');
            const hasPwm = hasEntity('pwm_value');
            const hasAnyInverter = hasHome || hasGrid || hasDiverter || hasSolar || hasBatteryPower;

            const solarEntityId = (getObj('solar_watts') || {}).entity_id || '';
            const batteryEntityId = (getObj('battery_power') || {}).entity_id || '';
            const gridEntityId = (getObj('grid_watts') || {}).entity_id || '';
            const homeEntityId = (getObj('load_watts') || {}).entity_id || '';
            const inverterEntityId = (getObj('calculated_watts') || {}).entity_id || '';

            const hasBatt = hasBatteryPower || hasBatterySoc;
            const layoutClass = (!hasBatt && hasGrid) ? ' layout-no-batt' : (hasBatt && !hasGrid) ? ' layout-no-grid' : '';

            const parts = ['<div class="ibep-flow-wrap' + layoutClass + '">'];

            if (hasSolar) parts.push('<div class="ibep-flow-connector ', cSolarCenter, '"></div>');
            if (hasBatteryPower) parts.push('<div class="ibep-flow-connector ', cBatteryCenter, '"></div>');
            if (hasGrid) parts.push('<div class="ibep-flow-connector ', cGridCenter, '"></div>');
            parts.push('<div class="ibep-flow-connector ', cHomeCenter, '"></div>');
            if (hasSolar && hasBatteryPower) parts.push('<div class="ibep-flow-connector ', cSolarBattery, '"></div>');
            if (hasSolar && hasGrid) parts.push('<div class="ibep-flow-connector ', cSolarGrid, '"></div>');
            if (hasBatteryPower) parts.push('<div class="ibep-flow-connector ', cBatteryHome, '"></div>');
            if (hasGrid) parts.push('<div class="ibep-flow-connector ', cGridHome, '"></div>');

            if (hasSolar) {
              parts.push(
                '<div class="ibep-flow-node node-solar ', (solarActive ? 'node-active' : 'node-idle'), '" data-entity="', solarEntityId, '">',
                  '<ha-icon class="node-icon" icon="mdi:solar-power"></ha-icon>',
                  '<div class="node-main">', solarMain, '</div>',
                  (hasSolarToday ? ('<div class="node-sub">' + solarSubText + '</div>') : ''),
                '</div>'
              );
            }

            if (hasBatteryPower || hasBatterySoc) {
              parts.push(
                '<div class="ibep-flow-node node-battery ', (batteryActive ? 'node-active' : 'node-idle'), '" data-entity="', batteryEntityId, '">',
                  '<ha-icon class="node-icon node-icon-rotated" icon="', battIcon, '" style="color:', battColor, ';"></ha-icon>',
                  (hasBatteryPower ? ('<div class="node-main ' + (batteryW < 0 ? 'is-negative' : '') + '">' + batteryMain + '</div>') : ''),
                  '<div class="node-sub">',
                    (batteryDirText ? ('<span class="node-sub-line node-sub-title">' + batteryDirText + '</span>') : ''),
                    (hasBatterySoc ? (batterySocText ? ('<span class="node-sub-line node-soc">SoC ' + batterySocText + '</span>') : '') : ''),
                  '</div>',
                '</div>'
              );
            }

            if (hasGrid) {
              parts.push(
                '<div class="ibep-flow-node node-grid ', (gridActive ? 'node-active' : 'node-idle'), '" data-entity="', gridEntityId, '">',
                  '<ha-icon class="node-icon" icon="mdi:transmission-tower"></ha-icon>',
                  '<div class="node-main ', (gridW < 0 ? 'is-negative' : ''), '">', gridMain, '</div>',
                  '<div class="node-sub">',
                    '<span class="node-sub-line node-sub-title">', gridDirText || '--', '</span>',
                    (hasImportToday ? ('<span class="node-sub-line">' + gridImpText + '</span>') : ''),
                    (hasExportToday ? ('<span class="node-sub-line">' + gridExpText + '</span>') : ''),
                  '</div>',
                '</div>'
              );
            }

            parts.push(
              '<div class="ibep-flow-node node-home ', (homeActive ? 'node-active' : 'node-idle'), '" data-entity="', homeEntityId, '">',
                '<ha-icon class="node-icon" icon="mdi:home-outline"></ha-icon>',
                '<div class="node-main">', homeMain, '</div>',
                '<div class="node-sub">'
            );
            if (hasDiverter) {
              parts.push('<span class="node-sub-line node-sub-title">', t.diverter, '</span>');
              if (hasPwm) parts.push('<span class="node-sub-line">', pwmText, ' - ', fmtAbsW(diverterW), '</span>');
              else parts.push('<span class="node-sub-line">', fmtAbsW(diverterW), '</span>');
            }
            if (hasDiverterToday) {
              parts.push('<span class="node-sub-line node-sub-spaced node-sub-title">', diverterTodayText, '</span>');
              parts.push('<span class="node-sub-line">', diverterTodayKwh, '</span>');
            }
            parts.push('</div>', '</div>');

            if (hasAnyInverter) {
              parts.push(
                '<div class="ibep-flow-node node-diverter ', (inverterActive ? 'node-active' : 'node-idle'), '" data-entity="', inverterEntityId, '">',
                  '<ha-icon class="node-icon" icon="mdi:lightning-bolt"></ha-icon>',
                  '<div class="node-sub node-sub-top">', t.inverter, '</div>',
                  '<div class="node-main">', inverterMain, '</div>',
                '</div>'
              );
            }

            parts.push('</div>');

            if (!window._ibepFlowClickHandler) {
              window._ibepFlowClickHandler = true;
              let _ibepTouchStart = null;
              const IBEP_TAP_THRESHOLD = 10;
              const ibepDispatch = (e, isTouchEnd) => {
                const path = e.composedPath();
                for (const el of path) {
                  if (el.classList && (el.classList.contains('ibep-flow-node') || el.classList.contains('ibep-temp-pill')) && el.hasAttribute && el.hasAttribute('data-entity')) {
                    const eid = el.getAttribute('data-entity');
                    if (eid) {
                      e.stopPropagation();
                      e.preventDefault();
                      if (isTouchEnd) el._ibepTouchHandled = Date.now();
                      const ev = new CustomEvent('hass-more-info', {
                        detail: { entityId: eid },
                        bubbles: true,
                        composed: true
                      });
                      el.dispatchEvent(ev);
                    }
                    break;
                  }
                }
              };
              document.addEventListener('touchstart', (e) => {
                if (e.touches && e.touches.length > 0) {
                  _ibepTouchStart = { x: e.touches[0].clientX, y: e.touches[0].clientY };
                }
              }, true);
              document.addEventListener('touchend', (e) => {
                if (_ibepTouchStart && e.changedTouches && e.changedTouches.length > 0) {
                  const dx = e.changedTouches[0].clientX - _ibepTouchStart.x;
                  const dy = e.changedTouches[0].clientY - _ibepTouchStart.y;
                  if (Math.abs(dx) > IBEP_TAP_THRESHOLD || Math.abs(dy) > IBEP_TAP_THRESHOLD) {
                    _ibepTouchStart = null;
                    return;
                  }
                }
                _ibepTouchStart = null;
                ibepDispatch(e, true);
              }, true);
              document.addEventListener('click', (e) => {
                const path = e.composedPath();
                for (const el of path) {
                  if (el.classList && (el.classList.contains('ibep-flow-node') || el.classList.contains('ibep-temp-pill')) && el._ibepTouchHandled && (Date.now() - el._ibepTouchHandled < 800)) return;
                  if (el.classList && (el.classList.contains('ibep-flow-node') || el.classList.contains('ibep-temp-pill'))) { ibepDispatch(e, false); return; }
                }
              }, true);
            }

            return parts.join('');
          ]]]
      styles:
        card:
          - border-radius: 24px
          - padding: 16px 16px 12px
          - border: 1px solid rgba(120, 220, 80, 0.90)
          - background: >-
              radial-gradient(circle at 18% 14%, rgba(255, 185, 0, 0.32),
              transparent 40%), radial-gradient(circle at 84% 85%, rgba(0, 210,
              255, 0.22), transparent 44%), radial-gradient(circle at 50% 88%,
              rgba(140, 230, 60, 0.18), transparent 48%),
              linear-gradient(145deg, rgba(38, 118, 58, 0.92), rgba(52, 148, 74,
              0.90))
          - box-shadow: 0 8px 32px rgba(0, 0, 0, 0.58)
        name:
          - justify-self: center
          - color: "#ffffff"
          - font-size: 1.35rem
          - font-weight: 700
          - letter-spacing: 0.04em
          - text-transform: uppercase
          - text-align: center
          - text-shadow: 0 1px 4px rgba(0,0,0,0.55)
          - width: 100%
          - padding: 4px 6px 8px
        grid:
          - grid-template-areas: "\"logo\" \"n\" \"flow\""
          - grid-template-columns: 1fr
          - row-gap: 4px
        custom_fields:
          logo:
            - justify-self: center
            - width: 100%
            - padding-top: 2px
          flow:
            - justify-self: stretch
      extra_styles: |
        .ibep-brand-logo-wrap {
          display: inline-flex;
          align-items: center;
          justify-content: center;
          padding: 5px 9px;
          border-radius: 10px;
        }
        .ibep-brand-logo {
          display: block;
          width: min(46vw, 180px);
          max-width: 100%;
          height: auto;
          object-fit: contain;
        }
        .ibep-flow-wrap {
          position: relative;
          width: min(100%, 460px);
          aspect-ratio: 1 / 1;
          height: auto;
          min-height: 300px;
          margin: 2px auto 0;
          border-radius: 16px;
          overflow: hidden;
          background: rgba(10, 18, 28, 0.35);
          border: 1px solid rgba(255, 255, 255, 0.10);
          --ox: 0%;
        }
        .layout-no-batt {
          --ox: -16.5%;
        }
        .layout-no-grid {
          --ox: 16.5%;
        }
        .ibep-flow-connector {
          position: absolute;
          z-index: 1;
          border-radius: 999px;
          --link-color: rgba(120, 132, 152, 0.24);
          background: var(--link-color);
          transition: opacity 0.2s ease;
          background-image: repeating-linear-gradient(90deg, rgba(255,255,255,0) 0px, rgba(255,255,255,0) 7px, var(--link-color) 7px, var(--link-color) 14px, rgba(255,255,255,0.8) 14px, rgba(255,255,255,0.8) 17px, rgba(255,255,255,0) 17px, rgba(255,255,255,0) 24px);
        }
        .ibep-flow-connector.is-idle {
          opacity: 0.28;
        }
        .ibep-flow-connector.is-active {
          opacity: 0.85;
        }
        .ibep-flow-connector.flow-right.is-active {
          animation: flowRight 1.05s linear infinite, pipeGlow 1.9s ease-in-out infinite;
        }
        .ibep-flow-connector.flow-left.is-active {
          animation: flowLeft 1.05s linear infinite, pipeGlow 1.9s ease-in-out infinite;
        }
        .ibep-flow-connector.flow-down.is-active {
          background-image: repeating-linear-gradient(180deg, rgba(255,255,255,0) 0px, rgba(255,255,255,0) 7px, var(--link-color) 7px, var(--link-color) 14px, rgba(255,255,255,0.8) 14px, rgba(255,255,255,0.8) 17px, rgba(255,255,255,0) 17px, rgba(255,255,255,0) 24px);
          animation: flowDown 1.05s linear infinite, pipeGlow 1.9s ease-in-out infinite;
        }
        .ibep-flow-connector.flow-up.is-active {
          background-image: repeating-linear-gradient(180deg, rgba(255,255,255,0) 0px, rgba(255,255,255,0) 7px, var(--link-color) 7px, var(--link-color) 14px, rgba(255,255,255,0.8) 14px, rgba(255,255,255,0.8) 17px, rgba(255,255,255,0) 17px, rgba(255,255,255,0) 24px);
          animation: flowUp 1.05s linear infinite, pipeGlow 1.9s ease-in-out infinite;
        }
        .link-solar-center {
          --link-color: rgba(255, 196, 61, 0.45);
          left: calc(50% - 1px + var(--ox, 0%));
          top: 17%;
          width: 2px;
          height: 33%;
        }
        .link-battery-center {
          --link-color: rgba(86, 201, 120, 0.45);
          left: calc(17% + var(--ox, 0%));
          top: calc(50% - 1px);
          width: 33%;
          height: 2px;
        }
        .link-grid-center {
          --link-color: rgba(156, 118, 255, 0.45);
          left: calc(50% + var(--ox, 0%));
          top: calc(50% - 1px);
          width: 33%;
          height: 2px;
        }
        .link-home-center {
          --link-color: rgba(66, 153, 255, 0.45);
          left: calc(50% - 1px + var(--ox, 0%));
          top: 50%;
          width: 2px;
          height: 33%;
        }
        .link-solar-battery {
          --link-color: rgba(255, 196, 61, 0.45);
          left: calc(50% + var(--ox, 0%));
          top: calc(17% - 1px);
          width: 47%;
          height: 2px;
          transform-origin: left center;
          transform: rotate(135deg);
        }
        .link-solar-grid {
          --link-color: rgba(255, 196, 61, 0.45);
          left: calc(50% + var(--ox, 0%));
          top: calc(17% - 1px);
          width: 47%;
          height: 2px;
          transform-origin: left center;
          transform: rotate(45deg);
        }
        .link-battery-home {
