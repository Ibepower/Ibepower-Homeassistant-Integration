    - type: custom:button-card
      entity: ${'sensor.' + vars[0] + '_pv1_voltage'}
      show_icon: false
      show_name: false
      show_state: false
      variables:
        base: ${vars[0]}
      triggers_update:
        - ${'sensor.' + vars[0] + '_pv1_voltage'}
        - ${'sensor.pv1_voltage_' + vars[0]}
        - ${'sensor.' + vars[0] + '_pv1_current'}
        - ${'sensor.pv1_current_' + vars[0]}
        - ${'sensor.' + vars[0] + '_pv1_power'}
        - ${'sensor.pv1_power_' + vars[0]}
        - ${'sensor.' + vars[0] + '_pv2_voltage'}
        - ${'sensor.pv2_voltage_' + vars[0]}
        - ${'sensor.' + vars[0] + '_pv2_current'}
        - ${'sensor.pv2_current_' + vars[0]}
        - ${'sensor.' + vars[0] + '_pv2_power'}
        - ${'sensor.pv2_power_' + vars[0]}
      custom_fields:
        pv_strings: |
          [[[
            const base = variables.base;
            const safeStates = (states && typeof states === 'object') ? states : {};
            const invalidState = (state) => {
              const s = String(state ?? '').trim().toLowerCase();
              return !s || s === 'unknown' || s === 'unavailable' || s === 'none' || s === 'null';
            };
            const getObj = (field) => {
              const a = safeStates['sensor.' + base + '_' + field];
              const b = safeStates['sensor.' + field + '_' + base];
              const obj = a || b;
              if (!obj || invalidState(obj.state)) return null;
              return obj;
            };
            const toNum = (value) => {
              const n = Number(String(value ?? '').replace(',', '.'));
              return Number.isFinite(n) ? n : null;
            };
            const fmt = (value, decimals) => value === null ? '--' : value.toFixed(decimals);
            const buildStringCard = (label, key) => {
              const vObj = getObj(key + '_voltage');
              const aObj = getObj(key + '_current');
              const wObj = getObj(key + '_power');
              const metricHtml = (obj, decimals, unit) => {
                if (!obj) return '';
                const value = toNum(obj.state);
                return '<span class="ibep-pv-metric"><span class="ibep-pv-val">' + fmt(value, decimals) + '</span><span class="ibep-pv-key">' + unit + '</span></span>';
              };
              const metrics = [
                metricHtml(vObj, 1, 'V'),
                metricHtml(aObj, 1, 'A'),
                metricHtml(wObj, 0, 'W')
              ].filter(Boolean);
              if (!metrics.length) return null;
              return [
                '<div class="ibep-pv-pill">',
                  '<span class="ibep-pv-title">', label, '</span>',
                  '<div class="ibep-pv-metrics">',
                    metrics.join(''),
                  '</div>',
                '</div>'
              ].join('');
            };
            const cards = [
              buildStringCard('PV1', 'pv1'),
              buildStringCard('PV2', 'pv2')
            ].filter(Boolean);
            if (!cards.length) return '';
            return '<div class="ibep-pv-wrap">' + cards.join('') + '</div>';
          ]]]
      styles:
        card:
          - border-radius: 14px
          - margin-top: 2px
          - padding: 10px 12px 8px
          - background: >-
              linear-gradient(145deg, rgba(40, 130, 60, 0.88), rgba(55, 160, 75,
              0.84))
          - border: 1px solid rgba(120, 220, 80, 0.90)
          - display: |
              [[[
                const base = variables.base;
                const safeStates = (states && typeof states === 'object') ? states : {};
                const hasEntity = (field) => {
                  const obj = safeStates['sensor.' + base + '_' + field] || safeStates['sensor.' + field + '_' + base];
                  if (!obj) return false;
                  const s = String(obj.state ?? '').trim().toLowerCase();
                  return !!s && s !== 'unknown' && s !== 'unavailable' && s !== 'none' && s !== 'null';
                };
                const hasPv1 = hasEntity('pv1_voltage') || hasEntity('pv1_current') || hasEntity('pv1_power');
                const hasPv2 = hasEntity('pv2_voltage') || hasEntity('pv2_current') || hasEntity('pv2_power');
                return (hasPv1 || hasPv2) ? 'block' : 'none';
              ]]]
        grid:
          - grid-template-areas: "\"pv_strings\""
          - grid-template-columns: 1fr
          - grid-template-rows: auto
        custom_fields:
          pv_strings:
            - justify-self: stretch
            - width: 100%
      extra_styles: |
