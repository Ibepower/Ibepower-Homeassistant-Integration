# Ibepower Ibediv energy-flow card (base-name mode)
#
# Requirements (HACS):
# - config-template-card
# - button-card
#
# Use:
# 1) Change only BASE below (slug):
#    variables:
#      - "'test_no_usar'"
# 2) Optional: adjust logo path (default bundled by integration):
#      - "'/ibepower_static/ibepower_logo.png'"
# 3) Done. The card will resolve entities as: sensor.<BASE>_<field>

type: custom:config-template-card
variables:
  - "'test_no_usar'"
  - "'/ibepower_static/ibepower_logo.png'"
entities:
  - ${'switch.' + vars[0] + '_ibediv'}
  - ${'switch.ibediv_' + vars[0]}
  - ${'switch.' + vars[0] + '_switch_on_off'}
  - ${'switch.switch_on_off_' + vars[0]}
  - ${'select.' + vars[0] + '_modo_de_trabajo'}
  - ${'select.modo_de_trabajo_' + vars[0]}
  - ${'select.' + vars[0] + '_work_mode_select'}
  - ${'select.work_mode_select_' + vars[0]}
  - ${'number.' + vars[0] + '_manual'}
  - ${'number.manual_' + vars[0]}
  - ${'number.' + vars[0] + '_pwm_value_setter'}
  - ${'number.pwm_value_setter_' + vars[0]}
card:
  type: vertical-stack
  cards:
    - type: custom:button-card
      entity: ${'sensor.' + vars[0] + '_calculated_watts'}
      name: "${('' + vars[0]).toUpperCase()}"
      show_icon: false
      show_state: false
      show_label: false
      variables:
        base: ${vars[0]}
        logo_src: ${vars[1]}
      triggers_update:
        - ${'sensor.' + vars[0] + '_solar_watts'}
        - ${'sensor.solar_watts_' + vars[0]}
        - ${'sensor.' + vars[0] + '_grid_watts'}
        - ${'sensor.grid_watts_' + vars[0]}
        - ${'sensor.' + vars[0] + '_load_watts'}
        - ${'sensor.load_watts_' + vars[0]}
        - ${'sensor.' + vars[0] + '_battery_power'}
        - ${'sensor.battery_power_' + vars[0]}
        - ${'sensor.' + vars[0] + '_battery_soc'}
        - ${'sensor.battery_soc_' + vars[0]}
        - ${'sensor.' + vars[0] + '_calculated_watts'}
        - ${'sensor.calculated_watts_' + vars[0]}
        - ${'sensor.' + vars[0] + '_kw_solar_today'}
        - ${'sensor.kw_solar_today_' + vars[0]}
        - ${'sensor.' + vars[0] + '_kw_import_today'}
        - ${'sensor.kw_import_today_' + vars[0]}
        - ${'sensor.' + vars[0] + '_kw_export_today'}
        - ${'sensor.kw_export_today_' + vars[0]}
        - ${'sensor.' + vars[0] + '_kw_diverter_today'}
        - ${'sensor.kw_diverter_today_' + vars[0]}
      custom_fields:
        logo: >
          [[[
            const toUrl = (p) => {
              if (hass && typeof hass.hassUrl === 'function') return hass.hassUrl(p);
              return p;
            };
            const primary = String(variables.logo_src || '/ibepower_static/ibepower_logo.png');
            const fallback = '/local/ibepower_logo.png';
            const src = toUrl(primary);
            const fallbackSrc = toUrl(fallback);
            return '<div class="ibep-brand-logo-wrap"><img class="ibep-brand-logo" src="' + src + '" data-fallback="' + fallbackSrc + '" onerror="if(!this.dataset.err){this.dataset.err=\'1\';this.src=this.dataset.fallback;}" alt="Ibepower"></div>';
          ]]]
        flow: >
          [[[
            const base = variables.base;
            const getObj = (field) => states['sensor.' + base + '_' + field] || states['sensor.' + field + '_' + base];
            const getRaw = (field) => getObj(field)?.state;
            const num = (field) => {
              const raw = String(getRaw(field) ?? '').replace(',', '.');
              const v = Number(raw);
              return Number.isFinite(v) ? v : 0;
            };
            const fmtW = (v) => Math.round(Math.abs(v)) + ' W';
            const fmtK = (v) => Number(v).toFixed(2) + ' kWh';
    
            const solarW = num('solar_watts');
            const gridW = num('grid_watts');
            const loadW = num('load_watts');
            const batteryW = num('battery_power');
            const batterySoc = num('battery_soc');
            const diverterW = num('calculated_watts');
    
            const solarK = num('kw_solar_today');
            const importK = num('kw_import_today');
            const exportK = num('kw_export_today');
            const diverterK = num('kw_diverter_today');
    
            const browserLang = (typeof navigator !== 'undefined' && navigator.language) ? navigator.language : '';
            const rawLang = String(
              hass?.language ||
              hass?.selectedLanguage ||
              hass?.locale?.language ||
              browserLang ||
              'en'
            ).toLowerCase();
            const lang = rawLang.startsWith('es')
              ? 'es'
              : rawLang.startsWith('pt')
                ? 'pt'
                : rawLang.startsWith('en')
                  ? 'en'
                  : 'en';
            const i18n = {
              es: {
                solar: 'Solar',
                grid: 'Red',
                home: 'Hogar',
                battery: 'Bateria',
                charging: 'Cargando',
                discharging: 'Descargando',
                importing: 'Importando',
                exporting: 'Exportando',
                imp: 'Imp',
                exp: 'Exp',
                diverter: 'Derivando',
                diverterToday: 'Derivado Hoy'
              },
              en: {
                solar: 'Solar',
                grid: 'Grid',
                home: 'Home',
                battery: 'Battery',
                charging: 'Charging',
                discharging: 'Discharging',
                importing: 'Importing',
                exporting: 'Exporting',
                imp: 'Imp',
                exp: 'Exp',
                diverter: 'Diverter',
                diverterToday: 'Diverted Today'
              },
              pt: {
                solar: 'Solar',
                grid: 'Rede',
                home: 'Casa',
                battery: 'Bateria',
                charging: 'Carregando',
                discharging: 'Descarregando',
                importing: 'Importando',
                exporting: 'Exportando',
                imp: 'Imp',
                exp: 'Exp',
                diverter: 'Diverter',
                diverterToday: 'Derivado Hoje'
              }
            };
            const t = i18n[lang] || i18n.en;
    
            const gridArrow = gridW >= 0 ? '<< ' : '>> ';
            const battDir = batteryW >= 0 ? t.charging : t.discharging;
            const battArrow = batteryW >= 0 ? '>> ' : '<< ';
            const gridDir = gridW >= 0 ? t.exporting : t.importing;
    
            const solarActive = solarW > 0;
            const gridActive = Math.abs(gridW) > 0;
            const homeActive = loadW > 0;
            const batteryActive = Math.abs(batteryW) > 0;
    
            const pSolar = (solarActive ? 'active ' : 'idle ') + 'solar flow-down';
            const pGrid = (gridActive ? 'active ' : 'idle ') + 'grid ' + (gridW >= 0 ? 'flow-left' : 'flow-right');
            const pHome = (homeActive ? 'active ' : 'idle ') + 'home flow-right';
            const pBattery = (batteryActive ? 'active ' : 'idle ') + 'battery ' + (batteryW >= 0 ? 'flow-down' : 'flow-up');
            const hasFlow = solarActive || gridActive || homeActive || batteryActive;
    
            return [
              '<div class=\"ibep-flow-wrap\">',
              '<div class=\"ibep-flow-pipe pipe-top ', pSolar, '\"></div>',
              '<div class=\"ibep-flow-pipe pipe-left ', pGrid, '\"></div>',
              '<div class=\"ibep-flow-pipe pipe-right ', pHome, '\"></div>',
              '<div class=\"ibep-flow-pipe pipe-bottom ', pBattery, '\"></div>',
              '<div class=\"ibep-flow-node node-solar ', (solarActive ? 'node-active' : 'node-idle'), '\">',
                '<div class=\"node-title\">', t.solar, '</div>',
                '<div class=\"node-main\">', fmtW(solarW), '</div>',
                '<div class=\"node-sub\">', fmtK(solarK), '</div>',
              '</div>',
              '<div class=\"ibep-flow-node node-grid ', (gridActive ? 'node-active' : 'node-idle'), '\">',
                '<div class=\"node-title\">', t.grid, '</div>',
                '<div class=\"node-main\">', gridArrow, fmtW(gridW), '</div>',
                '<div class=\"node-sub\"><span class=\"node-sub-line node-sub-gap-after\">', gridDir, '</span><span class=\"node-sub-line\">', t.imp, '. ', fmtK(importK), '</span><span class=\"node-sub-line\">', t.exp, '. ', fmtK(exportK), '</span></div>',
              '</div>',
              '<div class=\"ibep-flow-node node-home ', (homeActive ? 'node-active' : 'node-idle'), '\">',
                '<div class=\"node-title\">', t.home, '</div>',
                '<div class=\"node-main\">', fmtW(loadW), '</div>',
                '<div class=\"node-sub\"><span class=\"node-sub-line\">', t.diverter, '</span><span class=\"node-sub-line node-sub-gap-after\">', fmtW(diverterW), '</span><span class=\"node-sub-line\">', t.diverterToday, '</span><span class=\"node-sub-line\">', fmtK(diverterK), '</span></div>',
              '</div>',
              '<div class=\"ibep-flow-node node-battery ', (batteryActive ? 'node-active' : 'node-idle'), '\">',
                '<div class=\"node-title\">', t.battery, '</div>',
                '<div class=\"node-main\">', battArrow, fmtW(batteryW), '</div>',
                '<div class=\"node-sub\"><span class=\"node-sub-line node-sub-gap-after\">', battDir, '</span><span class=\"node-sub-line\">SoC ', Math.round(batterySoc), '%</span></div>',
              '</div>',
              '<div class=\"ibep-flow-center ', (hasFlow ? 'live' : 'idle'), '\"></div>',
              '</div>'
            ].join('');
          ]]]
      styles:
        card:
          - border-radius: 24px
          - padding: 16px 16px 12px
          - border: 1px solid rgba(75, 204, 226, 0.40)
          - background: radial-gradient(circle at 18% 14%, rgba(255, 205, 15, 0.18), transparent 40%), radial-gradient(circle at 84% 85%, rgba(75, 204, 226, 0.16), transparent 44%), radial-gradient(circle at 50% 88%, rgba(161, 210, 28, 0.10), transparent 48%), linear-gradient(145deg, rgba(64, 92, 68, 0.90), rgba(90, 124, 96, 0.88))
          - box-shadow: 0 8px 28px rgba(0, 0, 0, 0.42)
        name:
          - justify-self: center
          - color: '#ffffff'
          - font-size: 1.35rem
          - font-weight: 700
          - letter-spacing: 0.04em
          - text-transform: uppercase
          - text-align: center
          - text-shadow: 0 1px 4px rgba(0,0,0,0.55)
          - width: 100%
          - padding: 4px 6px 8px
        grid:
          - grid-template-areas: '"logo" "n" "flow"'
          - grid-template-columns: 1fr
          - row-gap: 4px
        custom_fields:
          logo:
            - justify-self: center
            - width: 100%
            - padding-top: 2px
          flow:
            - justify-self: stretch
      extra_styles: |
        .ibep-brand-logo-wrap {
          display: inline-flex;
          align-items: center;
          justify-content: center;
          padding: 5px 9px;
          border-radius: 10px;
          background: rgba(255, 255, 255, 0.10);
          border: 1px solid rgba(126, 207, 226, 0.32);
          box-shadow: 0 4px 10px rgba(0, 0, 0, 0.30);
        }
        .ibep-brand-logo {
          display: block;
          width: min(46vw, 180px);
          max-width: 100%;
          height: auto;
          object-fit: contain;
        }
        .ibep-flow-wrap {
          position: relative;
          height: 356px;
          margin-top: 2px;
          border-radius: 18px;
          overflow: hidden;
          background:
            radial-gradient(circle at 18% 14%, rgba(255, 205, 15, 0.18), transparent 38%),
            radial-gradient(circle at 82% 78%, rgba(75, 204, 226, 0.15), transparent 42%),
            radial-gradient(circle at 54% 88%, rgba(161, 210, 28, 0.08), transparent 48%),
            linear-gradient(155deg, rgba(56, 80, 60, 0.88), rgba(78, 108, 84, 0.86));
          border: 1px solid rgba(124, 207, 226, 0.26);
        }
        .ibep-flow-wrap::before {
          content: "";
          position: absolute;
          inset: 0;
          z-index: 0;
          pointer-events: none;
          background: repeating-linear-gradient(0deg, rgba(255, 255, 255, 0.028) 0px, rgba(255, 255, 255, 0.028) 1px, transparent 1px, transparent 24px);
        }
    
        .ibep-flow-center {
          position: absolute;
          z-index: 4;
          left: 50%;
          top: 50%;
          width: 14px;
          height: 14px;
          transform: translate(-50%, -50%);
          border-radius: 50%;
          background: #A1D21C;
          box-shadow: 0 0 10px rgba(161, 210, 28, 0.62);
        }
        .ibep-flow-center.live {
          animation: centerBeat 1.6s ease-in-out infinite;
          box-shadow: 0 0 16px rgba(161, 210, 28, 0.88), 0 0 28px rgba(121, 188, 28, 0.42);
        }
        .ibep-flow-center.idle {
          opacity: 0.65;
        }
    
        .ibep-flow-pipe {
          position: absolute;
          z-index: 1;
          border-radius: 999px;
          opacity: 0.42;
          background: rgba(210, 220, 230, 0.18);
          box-shadow: inset 0 0 0 1px rgba(180, 200, 220, 0.22);
        }
        .ibep-flow-pipe.idle {
          opacity: 0.24;
        }
        .ibep-flow-pipe.active {
          opacity: 1;
          box-shadow: 0 0 10px var(--flow-glow, rgba(121, 188, 28, 0.5));
        }
        .ibep-flow-pipe.solar { --flow-color: #FFCD0F; --flow-glow: rgba(255, 205, 15, 0.60); }
        .ibep-flow-pipe.grid { --flow-color: #4BCCE2; --flow-glow: rgba(75, 204, 226, 0.58); }
        .ibep-flow-pipe.home { --flow-color: #A1D21C; --flow-glow: rgba(161, 210, 28, 0.56); }
        .ibep-flow-pipe.battery { --flow-color: #7ECFE2; --flow-glow: rgba(126, 207, 226, 0.58); }
    
        .pipe-top {
          left: calc(50% - 1.5px);
          top: 138px;
          width: 3px;
          height: 40px;
        }
        .pipe-left {
          left: 140px;
          top: calc(50% - 1.5px);
          width: calc(50% - 140px);
          height: 3px;
        }
        .pipe-right {
          left: 50%;
          top: calc(50% - 1.5px);
          width: calc(50% - 140px);
          height: 3px;
        }
        .pipe-bottom {
          left: calc(50% - 1.5px);
          top: 50%;
          width: 3px;
          height: 36px;
        }
    
        .ibep-flow-pipe.active.flow-right {
          background-image: repeating-linear-gradient(90deg, rgba(255,255,255,0) 0px, rgba(255,255,255,0) 8px, var(--flow-color) 8px, var(--flow-color) 17px, rgba(255,255,255,0.9) 17px, rgba(255,255,255,0.9) 20px, rgba(255,255,255,0) 20px, rgba(255,255,255,0) 28px);
          animation: flowRight 1s linear infinite, pipeGlow 2s ease-in-out infinite;
        }
        .ibep-flow-pipe.active.flow-left {
          background-image: repeating-linear-gradient(90deg, rgba(255,255,255,0) 0px, rgba(255,255,255,0) 8px, var(--flow-color) 8px, var(--flow-color) 17px, rgba(255,255,255,0.9) 17px, rgba(255,255,255,0.9) 20px, rgba(255,255,255,0) 20px, rgba(255,255,255,0) 28px);
          animation: flowLeft 1s linear infinite, pipeGlow 2s ease-in-out infinite;
        }
        .ibep-flow-pipe.active.flow-down {
          background-image: repeating-linear-gradient(180deg, rgba(255,255,255,0) 0px, rgba(255,255,255,0) 8px, var(--flow-color) 8px, var(--flow-color) 17px, rgba(255,255,255,0.9) 17px, rgba(255,255,255,0.9) 20px, rgba(255,255,255,0) 20px, rgba(255,255,255,0) 28px);
          animation: flowDown 1.1s linear infinite, pipeGlow 2s ease-in-out infinite;
        }
        .ibep-flow-pipe.active.flow-up {
          background-image: repeating-linear-gradient(180deg, rgba(255,255,255,0) 0px, rgba(255,255,255,0) 8px, var(--flow-color) 8px, var(--flow-color) 17px, rgba(255,255,255,0.9) 17px, rgba(255,255,255,0.9) 20px, rgba(255,255,255,0) 20px, rgba(255,255,255,0) 28px);
          animation: flowUp 1.1s linear infinite, pipeGlow 2s ease-in-out infinite;
        }
    
        .ibep-flow-node {
          position: absolute;
          z-index: 3;
          width: 132px;
          height: 132px;
          border-radius: 999px;
          display: flex;
          flex-direction: column;
          justify-content: center;
          align-items: center;
          text-align: center;
          padding: 8px 9px;
          box-sizing: border-box;
          border: 1.5px solid var(--node-accent, #A1D21C);
          background: radial-gradient(circle at 34% 28%, rgba(52, 52, 52, 0.94), rgba(30, 30, 30, 0.97));
          box-shadow: inset 0 0 18px rgba(255, 255, 255, 0.05), 0 4px 14px rgba(0,0,0,0.42);
          transition: transform 0.25s ease, box-shadow 0.25s ease, opacity 0.25s ease;
        }
        .ibep-flow-node.node-active {
          opacity: 1;
          animation: nodeBreathe 2.6s ease-in-out infinite;
          box-shadow: inset 0 0 20px rgba(255, 255, 255, 0.06), 0 0 16px var(--node-glow, rgba(161, 210, 28, 0.46));
        }
        .ibep-flow-node.node-idle {
          opacity: 0.88;
        }
        .node-solar {
          top: 6px;
          left: calc(50% - 66px);
          --node-accent: #FFCD0F;
          --node-glow: rgba(255, 205, 15, 0.52);
        }
        .node-grid {
          top: 112px;
          left: 8px;
          --node-accent: #4BCCE2;
          --node-glow: rgba(75, 204, 226, 0.52);
        }
        .node-home {
          top: 112px;
          right: 8px;
          --node-accent: #79BC1C;
          --node-glow: rgba(121, 188, 28, 0.48);
        }
        .node-battery {
          bottom: 6px;
          left: calc(50% - 66px);
          --node-accent: #7ECFE2;
          --node-glow: rgba(126, 207, 226, 0.52);
        }
    
        .node-title {
          color: #a8d8e8;
          width: 100%;
          max-width: 100%;
          font-size: 0.80rem;
          font-weight: 600;
          line-height: 1.1;
          letter-spacing: 0.03em;
          text-transform: uppercase;
          text-shadow: 0 1px 3px rgba(0,0,0,0.7);
          margin-bottom: 3px;
        }
        .node-main {
          color: #ffffff;
          width: 100%;
          max-width: 100%;
          font-size: 1.05rem;
          font-weight: 700;
          line-height: 1.1;
          letter-spacing: 0.01em;
          text-shadow: 0 1px 4px rgba(0,0,0,0.65);
          white-space: nowrap;
          overflow: hidden;
          text-overflow: ellipsis;
        }
        .node-sub {
          color: #7ECFE2;
          width: 100%;
          max-width: 100%;
          font-size: 0.62rem;
          font-weight: 500;
          line-height: 1.18;
          letter-spacing: 0.01em;
          text-shadow: 0 1px 2px rgba(0,0,0,0.6);
          margin-top: 3px;
          white-space: normal;
          overflow-wrap: anywhere;
          word-break: break-word;
        }
        .node-sub-line {
          display: block;
        }
        .node-sub-gap-after {
          margin-bottom: 4px;
        }
    
        @keyframes flowRight {
          0% { background-position: 0 0; }
          100% { background-position: 28px 0; }
        }
        @keyframes flowLeft {
          0% { background-position: 0 0; }
          100% { background-position: -28px 0; }
        }
        @keyframes flowDown {
          0% { background-position: 0 0; }
          100% { background-position: 0 28px; }
        }
        @keyframes flowUp {
          0% { background-position: 0 0; }
          100% { background-position: 0 -28px; }
        }
        @keyframes pipeGlow {
          0%, 100% { filter: brightness(1); }
          50% { filter: brightness(1.22); }
        }
        @keyframes centerBeat {
          0%, 100% { transform: translate(-50%, -50%) scale(1); }
          50% { transform: translate(-50%, -50%) scale(1.16); }
        }
        @keyframes nodeBreathe {
          0%, 100% { transform: translateY(0px); }
          50% { transform: translateY(-2px); }
        }
    
        @media (max-width: 540px) {
          .ibep-flow-wrap {
            height: 330px;
          }
          .ibep-flow-node {
            width: 116px;
            height: 116px;
            padding: 6px 8px;
          }
          .node-solar {
            top: 8px;
            left: calc(50% - 58px);
          }
          .node-grid {
            top: 106px;
            left: 2px;
          }
          .node-home {
            top: 106px;
            right: 2px;
          }
          .node-battery {
            bottom: 8px;
            left: calc(50% - 58px);
          }
          .pipe-top {
            top: 124px;
            height: 41px;
          }
          .pipe-left {
            left: 118px;
            width: calc(50% - 118px);
          }
          .pipe-right {
            width: calc(50% - 118px);
          }
          .pipe-bottom {
            height: 41px;
          }
          .node-title {
            font-size: 0.8rem;
          }
          .node-main {
            font-size: 0.9rem;
          }
          .node-sub {
            font-size: 0.6rem;
          }
        }
    - type: custom:button-card
      entity: ${'sensor.' + vars[0] + '_ibepower_temperature'}
      show_icon: false
      show_name: false
      show_state: false
      variables:
        base: ${vars[0]}
      triggers_update:
        - ${'sensor.' + vars[0] + '_inverter_temperature'}
        - ${'sensor.inverter_temperature_' + vars[0]}
        - ${'sensor.' + vars[0] + '_chip_temperature'}
        - ${'sensor.chip_temperature_' + vars[0]}
        - ${'sensor.' + vars[0] + '_thermo_temperature'}
        - ${'sensor.thermo_temperature_' + vars[0]}
        - ${'sensor.' + vars[0] + '_ibepower_temperature'}
        - ${'sensor.ibepower_temperature_' + vars[0]}
        - ${'sensor.' + vars[0] + '_custom_temperature'}
        - ${'sensor.custom_temperature_' + vars[0]}
        - ${'sensor.' + vars[0] + '_thermo_sensor_name'}
        - ${'sensor.thermo_sensor_name_' + vars[0]}
        - ${'sensor.' + vars[0] + '_custom_sensor_name'}
        - ${'sensor.custom_sensor_name_' + vars[0]}
      custom_fields:
        temps: >
          [[[ 
            const base = variables.base;
            const getObj = (field) => states['sensor.' + base + '_' + field] || states['sensor.' + field + '_' + base];
            const toNum = (value) => {
              const n = Number(String(value ?? '').replace(',', '.'));
              return Number.isFinite(n) ? n : null;
            };
            const rawLang = String(
              hass?.language ||
              hass?.selectedLanguage ||
              hass?.locale?.language ||
              ((typeof navigator !== 'undefined' && navigator.language) ? navigator.language : 'en') ||
              'en'
            ).toLowerCase();
            const lang = rawLang.startsWith('es') ? 'es' : (rawLang.startsWith('pt') ? 'pt' : 'en');
            const i18n = {
              es: { none: 'No hay temperaturas activas', inverter: 'Inversor', chip: 'Chip', thermo: 'Termo', board: 'Ibepower', custom: 'Custom' },
              en: { none: 'No active temperatures', inverter: 'Inverter', chip: 'Chip', thermo: 'Thermo', board: 'Ibepower', custom: 'Custom' },
